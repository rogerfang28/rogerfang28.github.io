<!DOCTYPE html>
<html>
<head>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #333;
        line-height: 1.5;
        margin: 0;
        padding: 40px;
        max-width: 800px;
        margin-left: auto;
        margin-right: auto;
    }
    .header {
        display: block;
        border-bottom: 2px solid #444;
        padding-bottom: 20px;
        margin-bottom: 20px;
    }
    .photo-container {
        width: 120px;
        height: 150px;
        background-color: #eee;
        border: 1px solid #ccc;
        text-align: center;
        line-height: 150px;
        font-size: 12pt;
        color: #999;
        margin-bottom: 15px;
    }
    .name {
        font-size: 24pt;
        font-weight: bold;
        margin: 0;
        color: #222;
    }
    .title {
        font-size: 14pt;
        color: #666;
        margin-top: 5px;
    }
    .content {
        margin-top: 40px;
    }
    .section-title {
        font-size: 12pt;
        font-weight: bold;
        text-transform: uppercase;
        border-bottom: 1px solid #ddd;
        margin-bottom: 10px;
    }
    .link-box {
        margin-top: 20px;
        padding: 15px;
        background-color: #f9f9f9;
        border-left: 5px solid #007bff;
    }
    a {
        color: #007bff;
        text-decoration: none;
        font-weight: bold;
    }
</style>
</head>
<body>
    <div class="header">
        <div class="photo-container">
            [Photo]
        </div>
        <h1 class="name">Full Name</h1>
    </div>

    <div class="content">
        <div class="section-title">Academic Records</div>
        <div class="link-box">
            View Unofficial High School Transcript: <a href="transcript.pdf">Academic Transcript (PDF)</a>
        </div>
    </div>
</body>
</html>
